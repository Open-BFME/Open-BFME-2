# Source files whose declarations the guide documents, appended to INPUT.
#
# One "INPUT += <path>" line per file, relative to the repository root and
# grouped by subsystem; never a directory. Doxygen reads these files only for
# their declarations: docs/doxygen/strip_comments.py removes every comment
# first, so nothing written in the source reaches the guide.
#
# List a file in the same commit as the api/*.dox block that needs it:
#   - a \fn block needs the file that declares the function (for a member
#     function, the header or .cpp holding the class declaration that the
#     defining unit includes, even when it is in the BFME 1 submodule);
#   - a \file block needs the file it describes;
#   - a \class block needs nothing here, but its members' \fn blocks do.
# python3 tools/doc_lint.py checks that each entry exists.
