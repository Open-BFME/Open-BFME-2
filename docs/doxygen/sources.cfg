INPUT += Code/Libraries/Source/WWVegas/WWLib/gcd_lcm.cpp

# WWLib public-key crypto and multi-precision maths (api/w1_wwlib_pkey_mpmath.dox)
# PKey, Int, RemainderTable, Generate_Prime and the XMP_ prototypes are declared only in the BFME 1 reference headers the BFME 2 units compile against. pk.cpp is not listed: Doxygen cannot match its bignum static-member definitions and warns.
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWLib/pk.h
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWLib/int.h
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWLib/mpmath.h
INPUT += Code/Libraries/Source/WWVegas/WWLib/mpmath.cpp

