# Source files whose declarations the guide documents, appended to INPUT.
#
# One "INPUT += <path>" line per file, relative to the repository root and
# grouped by subsystem; never a directory. Doxygen reads these files only for
# their declarations: docs/doxygen/strip_comments.py removes every comment
# first, so nothing written in the source reaches the guide.
#
# List a file in the same commit as the api/*.dox block that needs it:
#   - a \fn block needs the file that declares the function (for a member
#     function, the header or .cpp holding the class declaration that the
#     defining unit includes, even when it is in the BFME 1 submodule);
#   - a \file block needs the file it describes;
#   - a \class block needs nothing here, but its members' \fn blocks do.
# python3 tools/doc_lint.py checks that each entry exists.

# EAC compression: Huffman codec (api/w1_eac_huffman.dox)
INPUT += Code/Libraries/Source/Compression/EAC/huffcodex.h
INPUT += Code/Libraries/Source/Compression/EAC/huffencode.cpp
INPUT += Code/Libraries/Source/Compression/EAC/huffdecode.cpp

# GUI: gadget helpers (api/w1_gui_gadgets.dox)
INPUT += Code/GameEngine/Source/GameClient/GUI/Gadget/GadgetTabControl.cpp
INPUT += Code/GameEngine/Source/GameClient/GUI/Gadget/GadgetComboBox.cpp
INPUT += Code/GameEngine/Source/GameClient/GUI/Gadget/GadgetPushButton.cpp
INPUT += Code/GameEngine/Source/GameClient/GUI/Gadget/GadgetProgressBar.cpp
INPUT += Code/GameEngine/Source/GameClient/GUI/Gadget/GadgetTextEntry.cpp
INPUT += reference/open-bfme-1/inputs/reference/CnC_Generals_Zero_Hour/GeneralsMD/Code/GameEngine/Include/GameClient/GadgetTextEntry.h

# Common services: EA debug library (api/w1_debug_lib.dox)
INPUT += Code/Libraries/Source/debug/debug_debug.cpp
INPUT += Code/Libraries/Source/debug/debug_internal.cpp
INPUT += Code/Libraries/Source/debug/debug_purecall.cpp
# Declarations only: the Zero Hour headers these units include (read-only)
INPUT += reference/open-bfme-1/inputs/reference/CnC_Generals_Zero_Hour/GeneralsMD/Code/Libraries/Source/debug/debug_debug.h
INPUT += reference/open-bfme-1/inputs/reference/CnC_Generals_Zero_Hour/GeneralsMD/Code/Libraries/Source/debug/debug_io.h
INPUT += reference/open-bfme-1/inputs/reference/CnC_Generals_Zero_Hour/GeneralsMD/Code/Libraries/Source/debug/internal_io.h

# WWLib streams: pipes, straws, Base64 and Read_Line (api/w1_wwlib_streams.dox)
# Class declarations exist only in the BFME 1 reference headers the BFME 2 units compile against.
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWLib/pipe.h
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWLib/straw.h
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWLib/xpipe.h
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWLib/xstraw.h
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWLib/cstraw.h
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWLib/b64pipe.h
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWLib/b64straw.h
INPUT += Code/Libraries/Source/WWVegas/WWLib/base64.cpp
INPUT += Code/Libraries/Source/WWVegas/WWLib/readline.cpp

# WWLib: Targa image I/O and BufferedFileClass (api/w1_wwlib_targa_bufffile.dox)
INPUT += Code/Libraries/Source/WWVegas/WWLib/TARGA.CPP
INPUT += Code/Libraries/Source/WWVegas/WWLib/bufffile.cpp
# Declarations only (read-only submodule). TARGA.CPP compiles against the Zero
# Hour TARGA.H, which enables the WWLib file classes; bufffile.cpp includes
# the Open-BFME-1 bufffile.h.
INPUT += reference/open-bfme-1/inputs/reference/CnC_Generals_Zero_Hour/GeneralsMD/Code/Libraries/Source/WWVegas/WWLib/TARGA.H
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWLib/bufffile.h

# WWMath: Matrix4, Vector4, axis-aligned boxes and power-of-two helpers (api/w1_wwmath_matrix4_aabox.dox)
INPUT += Code/Libraries/Source/WWVegas/WWMath/matrix4.cpp
INPUT += Code/Libraries/Source/WWVegas/WWMath/aabox.cpp
INPUT += Code/Libraries/Source/WWVegas/WWMath/colmath.cpp
INPUT += Code/Libraries/Source/WWVegas/WW3D2/pot.cpp
# Declarations only (read-only submodule): the BFME 1 headers these units
# include, never the private matrix4.h copies under reference/shims/.
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWMath/matrix4.h
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWMath/vector4.h
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWMath/aabox.h
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWMath/colmath.h
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WW3D2/pot.h

# WWLib random numbers and C-string helpers (api/w1_wwlib_random_strutil.dox)
# The generator classes and Pick_Random_Number are declared only in the BFME 1 reference header the BFME 2 unit compiles against.
INPUT += reference/open-bfme-1/game/Libraries/Source/WWVegas/WWLib/random.h
INPUT += Code/Libraries/Source/WWVegas/WWLib/random.cpp
INPUT += Code/Libraries/Source/WWVegas/WWLib/trim.cpp
