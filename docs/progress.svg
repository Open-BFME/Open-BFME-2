<svg xmlns="http://www.w3.org/2000/svg" width="880" height="582" viewBox="0 0 880 582" role="img" aria-labelledby="title desc">
  <title id="title">BFME 2 · Road to a finished decomp: 100.00% byte match, 98.69% linking (3,849 problems recorded)</title>
  <desc id="desc">Finished means: the whole game is built from readable source, builds the normal way, and plays. Is the source clean? hand-written code 96.41%, readable names 69.01%, shortcuts removed 32.68%, original file layout 12.38%, shared class definitions 5.18%. Shortcuts, file layout and shared classes count from the start of Phase 2 (Oct 25). How each figure is measured: README.</desc>
  <style>
    .card { fill: #0d1117; stroke: #30363d; } .track { fill: #21262d; } .box { fill: #161b22; stroke: #30363d; }
    .strong { fill: #f0f6fc; } .muted { fill: #8b949e; } .up { fill: #3fb950; } .down { fill: #f85149; }
    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; stroke: #d0d7de; } .track { fill: #eaeef2; } .box { fill: #f6f8fa; stroke: #d0d7de; }
      .strong { fill: #1f2328; } .muted { fill: #59636e; } .up { fill: #1a7f37; } .down { fill: #cf222e; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="879" height="581" rx="12"/>
  <g font-family="'Segoe UI',Arial" text-rendering="optimizeSpeed" kerning="0" style="font-kerning:none;font-feature-settings:'kern' 0">
    <text x="28" y="38" class="strong" font-size="20" font-weight="700">BFME 2 · Road to a finished decomp</text>
    <text x="28" y="60" class="muted" font-size="13">Finished means: the whole game is built from readable source, builds the normal way, and plays</text>
    <text x="28" y="96" class="muted" font-size="12" font-weight="600" letter-spacing="1.2">DOES IT WORK?</text>
    <text x="28" y="126" class="strong" font-size="15" font-weight="600">Byte match</text>
    <text x="852" y="126" class="strong" font-size="20" font-weight="700" text-anchor="end">100.00%</text>
    <rect class="track" x="28" y="136" width="824" height="14" rx="7"/>
    <rect x="28" y="136" width="824.00" height="14" rx="7" fill="#2ea043"/>
    <text x="28" y="170" class="muted" font-size="12.5">Every byte of the game's program code is recreated by compiling our source</text>
    <text x="852" y="170" class="muted" font-size="12.5" text-anchor="end">game data &amp; assets: not measured yet</text>
    <text x="28" y="202" class="strong" font-size="15" font-weight="600">Linking<tspan class="muted" dx="10" font-size="13" font-weight="600">accounting changed</tspan></text>
    <text x="852" y="202" class="strong" font-size="20" font-weight="700" text-anchor="end">98.69%</text>
    <rect class="track" x="28" y="212" width="824" height="14" rx="7"/>
    <rect x="28" y="212" width="813.17" height="14" rx="7" fill="#d29922"/>
    <text x="28" y="246" class="muted" font-size="12.5">Share of game code that links into one program; 3,849 problems recorded</text>
    <text x="28" y="262" class="muted" font-size="12.5">Census accounting changed to retail-truth-5 (95.24% under retail-truth-4), not a change in progress</text>
    <text x="852" y="246" class="muted" font-size="12.5" text-anchor="end">measured 2026-10-29</text>
    <rect class="box" x="28" y="288" width="824" height="34" rx="8"/>
    <text x="44" y="310" class="muted" font-size="14" font-weight="600">Next milestone:<tspan class="strong"> first normal build, then the first playtest</tspan></text>
    <text x="28" y="362" class="muted" font-size="12" font-weight="600" letter-spacing="1.2">IS THE SOURCE CLEAN?</text>
    <text x="28" y="392" class="strong" font-size="14" font-weight="600">Hand-written code</text>
    <rect class="track" x="304" y="382" width="464" height="10" rx="5"/>
    <rect x="304" y="382" width="447.35" height="10" rx="5" fill="#58a6ff"/>
    <text x="852" y="392" class="strong" font-size="15" font-weight="700" text-anchor="end">96.41%</text>
    <text x="28" y="422" class="strong" font-size="14" font-weight="600">Readable names<tspan class="muted" dx="10" font-size="12" font-weight="600">· 0.00</tspan></text>
    <rect class="track" x="304" y="412" width="464" height="10" rx="5"/>
    <rect x="304" y="412" width="320.23" height="10" rx="5" fill="#a371f7"/>
    <text x="852" y="422" class="strong" font-size="15" font-weight="700" text-anchor="end">69.01%</text>
    <text x="28" y="452" class="strong" font-size="14" font-weight="600">Shortcuts removed<tspan class="up" dx="10" font-size="12" font-weight="600">▲ 0.27</tspan></text>
    <rect class="track" x="304" y="442" width="464" height="10" rx="5"/>
    <rect x="304" y="442" width="151.65" height="10" rx="5" fill="#e05c7a"/>
    <text x="852" y="452" class="strong" font-size="15" font-weight="700" text-anchor="end">32.68%</text>
    <text x="28" y="482" class="strong" font-size="14" font-weight="600">Original file layout<tspan class="muted" dx="10" font-size="12" font-weight="600">accounting changed</tspan></text>
    <rect class="track" x="304" y="472" width="464" height="10" rx="5"/>
    <rect x="304" y="472" width="57.44" height="10" rx="5" fill="#f0883e"/>
    <text x="852" y="482" class="strong" font-size="15" font-weight="700" text-anchor="end">12.38%</text>
    <text x="28" y="498" class="muted" font-size="12.5">The TU map's estimate moved from 2,264 to 2,277 files, not a change in progress</text>
    <text x="28" y="528" class="strong" font-size="14" font-weight="600">Shared class definitions<tspan class="up" dx="10" font-size="12" font-weight="600">▲ 1.27</tspan></text>
    <rect class="track" x="304" y="518" width="464" height="10" rx="5"/>
    <rect x="304" y="518" width="24.02" height="10" rx="5" fill="#e05c7a"/>
    <text x="852" y="528" class="strong" font-size="15" font-weight="700" text-anchor="end">5.18%</text>
    <text x="28" y="562" class="muted" font-size="12">Shortcuts, file layout and shared classes count from the start of Phase 2 (Oct 25). How each figure is measured: README</text>
  </g>
</svg>
