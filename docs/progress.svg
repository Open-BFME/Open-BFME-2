<svg xmlns="http://www.w3.org/2000/svg" width="880" height="644" viewBox="0 0 880 644" role="img" aria-labelledby="title desc">
  <title id="title">BFME 2 · Road to a finished decomp: 100.00% byte match, 100.00% game code in C++*, 95.24% linking (4,778 problems recorded)</title>
  <desc id="desc">Finished means: the whole game is built from readable source, builds the normal way, and plays. Is the source clean? readable names 68.98%, shortcuts removed 32.41%, original file layout 11.16%, shared class definitions 3.79%. Shortcuts, file layout and shared classes count from the start of Phase 2 (Oct 25). How each figure is measured: README.</desc>
  <style>
    .card { fill: #0d1117; stroke: #30363d; } .track { fill: #21262d; } .box { fill: #161b22; stroke: #30363d; }
    .strong { fill: #f0f6fc; } .muted { fill: #8b949e; } .up { fill: #3fb950; } .down { fill: #f85149; }
    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; stroke: #d0d7de; } .track { fill: #eaeef2; } .box { fill: #f6f8fa; stroke: #d0d7de; }
      .strong { fill: #1f2328; } .muted { fill: #59636e; } .up { fill: #1a7f37; } .down { fill: #cf222e; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="879" height="643" rx="12"/>
  <g font-family="'Segoe UI',Arial" text-rendering="optimizeSpeed" kerning="0" style="font-kerning:none;font-feature-settings:'kern' 0">
    <text x="28" y="38" class="strong" font-size="20" font-weight="700">BFME 2 · Road to a finished decomp</text>
    <text x="28" y="60" class="muted" font-size="13">Finished means: the whole game is built from readable source, builds the normal way, and plays</text>
    <text x="28" y="96" class="muted" font-size="12" font-weight="600" letter-spacing="1.2">DOES IT WORK?</text>
    <text x="28" y="126" class="strong" font-size="15" font-weight="600">Byte match</text>
    <text x="852" y="126" class="strong" font-size="20" font-weight="700" text-anchor="end">100.00%</text>
    <rect class="track" x="28" y="136" width="824" height="14" rx="7"/>
    <rect x="28" y="136" width="824.00" height="14" rx="7" fill="#2ea043"/>
    <text x="28" y="170" class="muted" font-size="12.5">Every byte of the game's program code is recreated by compiling our source</text>
    <text x="852" y="170" class="muted" font-size="12.5" text-anchor="end">game data &amp; assets: not measured yet</text>
    <text x="28" y="202" class="strong" font-size="15" font-weight="600">Game code in C++*</text>
    <text x="852" y="202" class="strong" font-size="20" font-weight="700" text-anchor="end">100.00%</text>
    <rect class="track" x="28" y="212" width="824" height="14" rx="7"/>
    <rect x="28" y="212" width="824.00" height="14" rx="7" fill="#388bfd"/>
    <text x="28" y="246" class="muted" font-size="12.5">7,512,658 / 7,512,658 bytes of executable game code (libraries and embedded data excluded)</text>
    <text x="28" y="262" class="muted" font-size="12.5">Includes generated C++ and intentionally retained assembly.</text>
    <text x="28" y="278" class="muted" font-size="12.5">Of it: authored C++ 96.41%, generated C++ 3.48%, reviewed assembly 0.11% of executable game code.</text>
    <text x="28" y="310" class="strong" font-size="15" font-weight="600">Linking<tspan class="muted" dx="10" font-size="13" font-weight="600">being re-measured</tspan></text>
    <text x="852" y="310" class="strong" font-size="20" font-weight="700" text-anchor="end">95.24%</text>
    <rect class="track" x="28" y="320" width="824" height="14" rx="7"/>
    <rect x="28" y="320" width="784.76" height="14" rx="7" fill="#d29922"/>
    <text x="28" y="354" class="muted" font-size="12.5">Share of game code that links into one program; 4,778 problems recorded</text>
    <text x="28" y="370" class="muted" font-size="12.5">The counting rules changed (retail-truth-4 to retail-truth-5): this is the last figure under the old rules until the next census</text>
    <text x="852" y="354" class="muted" font-size="12.5" text-anchor="end">measured 2026-10-28</text>
    <rect class="box" x="28" y="396" width="824" height="34" rx="8"/>
    <text x="44" y="418" class="muted" font-size="14" font-weight="600">Next milestone:<tspan class="strong"> first normal build, then the first playtest</tspan></text>
    <text x="28" y="470" class="muted" font-size="12" font-weight="600" letter-spacing="1.2">IS THE SOURCE CLEAN?</text>
    <text x="28" y="500" class="strong" font-size="14" font-weight="600">Readable names<tspan class="up" dx="10" font-size="12" font-weight="600">▲ 0.23</tspan></text>
    <rect class="track" x="215" y="490" width="553" height="10" rx="5"/>
    <rect x="215" y="490" width="381.43" height="10" rx="5" fill="#a371f7"/>
    <text x="852" y="500" class="strong" font-size="15" font-weight="700" text-anchor="end">68.98%</text>
    <text x="28" y="530" class="strong" font-size="14" font-weight="600">Shortcuts removed</text>
    <rect class="track" x="215" y="520" width="553" height="10" rx="5"/>
    <rect x="215" y="520" width="179.21" height="10" rx="5" fill="#e05c7a"/>
    <text x="852" y="530" class="strong" font-size="15" font-weight="700" text-anchor="end">32.41%</text>
    <text x="28" y="560" class="strong" font-size="14" font-weight="600">Original file layout</text>
    <rect class="track" x="215" y="550" width="553" height="10" rx="5"/>
    <rect x="215" y="550" width="61.73" height="10" rx="5" fill="#f0883e"/>
    <text x="852" y="560" class="strong" font-size="15" font-weight="700" text-anchor="end">11.16%</text>
    <text x="28" y="590" class="strong" font-size="14" font-weight="600">Shared class definitions</text>
    <rect class="track" x="215" y="580" width="553" height="10" rx="5"/>
    <rect x="215" y="580" width="20.97" height="10" rx="5" fill="#e05c7a"/>
    <text x="852" y="590" class="strong" font-size="15" font-weight="700" text-anchor="end">3.79%</text>
    <text x="28" y="624" class="muted" font-size="12">Shortcuts, file layout and shared classes count from the start of Phase 2 (Oct 25). How each figure is measured: README</text>
  </g>
</svg>
