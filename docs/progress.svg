    <text x="852" y="246" class="muted" font-size="12.5" text-anchor="end">measured 2026-10-31</text>
    <rect class="box" x="28" y="272" width="824" height="34" rx="8"/>
    <text x="44" y="294" class="muted" font-size="14" font-weight="600">Next milestone:<tspan class="strong"> first normal build, then the first playtest</tspan></text>
    <text x="28" y="346" class="muted" font-size="12" font-weight="600" letter-spacing="1.2">IS THE SOURCE CLEAN?</text>
