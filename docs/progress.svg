<svg xmlns="http://www.w3.org/2000/svg" width="880" height="550" viewBox="0 0 880 550" role="img" aria-labelledby="title desc">
  <title id="title">BFME 2 · Road to a finished decomp: 100.00% byte match, 99.41% linking (3,642 problems recorded)</title>
  <desc id="desc">Finished means: the whole game is built from readable source, builds the normal way, and plays. Is the source clean? hand-written code 96.41%, readable names 68.64%, shortcuts removed 33.60%, original file layout 21.44%, shared class definitions 5.60%. Shortcuts, file layout and shared classes count from the start of Phase 2 (Oct 25). How each figure is measured: README.</desc>
  <style>
    .card { fill: #0d1117; stroke: #30363d; } .track { fill: #21262d; } .box { fill: #161b22; stroke: #30363d; }
    .strong { fill: #f0f6fc; } .muted { fill: #8b949e; } .up { fill: #3fb950; } .down { fill: #f85149; }
    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; stroke: #d0d7de; } .track { fill: #eaeef2; } .box { fill: #f6f8fa; stroke: #d0d7de; }
      .strong { fill: #1f2328; } .muted { fill: #59636e; } .up { fill: #1a7f37; } .down { fill: #cf222e; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="879" height="549" rx="12"/>
  <g font-family="'Segoe UI',Arial" text-rendering="optimizeSpeed" kerning="0" style="font-kerning:none;font-feature-settings:'kern' 0">
