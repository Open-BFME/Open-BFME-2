name: Modernizer loader

# Builds the 1.06 modernizer (dinput8.dll and its blob) from source on every
# change to it, and publishes a release when a maintainer pushes a
# modernizer-v* tag. The blob links against baselines/ and the matched
# reference objects, so the whole build runs on a GitHub-hosted runner.
on:
  pull_request:
    paths:
      - 'tools/modern_blob.py'
      - 'tools/build_variant.py'
      - 'tools/tests/test_modern_blob.py'
      - 'mods/modernizer/**'
      - '.github/workflows/modernizer.yml'
  push:
    tags: ['modernizer-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modernizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Open-BFME/Open-BFME-2'
    # MSVC 7.1 ships in the Open-BFME-1 submodule; the loader needs the
    # runner's Visual Studio x86 tools.
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Non-recursive: BFME 1 references BFME 2, which references BFME 1.
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r reference/open-bfme-1/tools/requirements.txt
      - name: Blob format tests
        run: python -m pytest -q tools/tests/test_modern_blob.py
      - name: Compile the reference and modern objects
        shell: bash
        run: |
          mapfile -t sources < <(git grep -l BFME2_MODERN -- 'Code/*.cpp' 'Code/*.c')
          python tools/build.py "${sources[@]}"
          python tools/build_variant.py --compile "${sources[@]}" > /dev/null
      - name: Link the blob and build the loader
        run: python tools/build_variant.py --blob
      - name: Package
        shell: bash
        run: |
          name="bfme2-modernizer-${GITHUB_REF_NAME//\//-}"
          mkdir -p "dist/$name"
          cp build/modern/blob/dinput8.dll build/modern/blob/bfme2-modern-106.blob mods/modernizer/README.md "dist/$name/"
          (cd "dist/$name" && sha256sum dinput8.dll bfme2-modern-106.blob README.md > SHA256SUMS)
          cp build/modern/blob/blob_report.json dist/
          (cd dist && python -m zipfile -c "$name.zip" "$name")
          echo "PACKAGE=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bfme2-modernizer
          path: |
            dist/${{ env.PACKAGE }}.zip
            dist/${{ env.PACKAGE }}/SHA256SUMS
            dist/blob_report.json
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/modernizer-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bfme2-modernizer
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "BFME II 1.06 modernizer built from ${GITHUB_SHA} by the Modernizer loader workflow."
            echo
            echo "Copy dinput8.dll and bfme2-modern-106.blob from the zip into the BFME II 1.06 game folder; README.md inside lists settings and limits."
            echo
            echo '```'
            cat "dist/bfme2-modernizer-${TAG}/SHA256SUMS"
            echo '```'
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "BFME II modernizer ${TAG#modernizer-}" --notes-file notes.md \
            "dist/bfme2-modernizer-${TAG}.zip" dist/blob_report.json
