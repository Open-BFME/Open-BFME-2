name: BFME2 progress card

# Once a day (08:37 New York): re-render the README card, the chart and the map
# from the repository, post to Discord, and publish the interactive report on
# GitHub Pages. By hand: re-render, and post only when a "Does it work?" figure
# changed since the last post. (Hourly runs were dropped on 2026-10-29: the owner
# wants one update a day, and each hourly card commit was one more push racing
# the fleet's pushes to master.)
on:
  schedule:
    - cron: '37 8 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. `queue: max` keeps every pending run (FIFO, up to 100):
# with the default (`single`) a newer run (a manual one) would replace a pending
# daily run, and that day's post would be lost.
concurrency:
  group: readme-progress
  cancel-in-progress: false
  queue: max

jobs:
  update:
    if: github.repository == 'Open-BFME/Open-BFME-2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      daily: ${{ steps.mode.outputs.daily }}
    steps:
      - id: mode
        name: Daily post or hourly refresh
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$SCHEDULE" = '37 8 * * *' ]; then
            echo "daily=true" >> "$GITHUB_OUTPUT"
          else
            echo "daily=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A post is recorded outside the repository the moment it succeeds, keyed
      # on the run ID: a re-run of this run (a fresh checkout whose committed
      # state lacks the post) restores it instead of posting again.
      - id: record
        name: Restore this run's Discord post record
        uses: actions/cache/restore@v5
        with:
          path: build/discord-post.json
          key: discord-post-${{ github.run_id }}
      - name: Record today's byte-matched point for the chart
        run: python tools/progress_site.py history --today
      - name: Render the card and post BFME2 progress
        env:
          DISCORD_PROGRESS_WEBHOOK: ${{ secrets.DISCORD_PROGRESS_WEBHOOK }}
          POST: ${{ steps.mode.outputs.daily == 'true' && '--discord' || '--discord-on-change' }}
        run: python tools/readme_progress.py "$POST" --post-record build/discord-post.json
      - name: Keep this run's Discord post record
        if: always() && steps.record.outputs.cache-hit != 'true' && hashFiles('build/discord-post.json') != ''
        uses: actions/cache/save@v5
        with:
          path: build/discord-post.json
          key: discord-post-${{ github.run_id }}
      - name: Render the rules=v2 card (what the byte figures are made of)
        # never blocks the card above: a v2 failure leaves the last card
        continue-on-error: true
        run: python tools/progress_v2.py --today --svg docs/progress_v2.svg
      - name: Render the chart, the map and the interactive report
        run: python tools/progress_site.py render build/site/index.html --svg docs
      - name: Commit and push the updated card
        # The fleet pushes to master continuously. --publish retries a rejected
        # push and, when commits that landed meanwhile changed an input, draws
        # everything again on the tree it pushes onto (readme_progress.RENDER).
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/readme_progress.py --publish --post-record build/discord-post.json
      - if: steps.mode.outputs.daily == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  pages:
    needs: update
    if: needs.update.outputs.daily == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # the interactive report on GitHub Pages
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
