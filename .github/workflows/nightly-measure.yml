name: Nightly measurement

# Replaces the maintainer-PC builder/publisher accounts (docs/nightly_setup.md,
# superseded). docs/nightly_actions.md: what runs where, trust boundaries, setup.
# The two build jobs hold no secret and hand over data only. The publish job runs
# only its own checkout's tools on that data, then signs and publishes.
# No boot_smoke or game_smoke: hosted runners have no game install.
# Every job waits for the repository variable NIGHTLY_ENABLED=true, set last in setup
# (docs/nightly_actions.md): until then nothing runs and the environment is never auto-created.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Measure, validate and re-measure ownership, but record, release and push nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-measure
  cancel-in-progress: false

env:
  BUILD_POOL: '4'
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  # Exact versions in all three jobs: the builders and the publisher must resolve one toolchain.
  CONSTRAINTS: .github/nightly-constraints.txt

jobs:
  boot:
    name: Build, boot image, ownership report
    if: vars.NIGHTLY_ENABLED == 'true' && github.repository == 'Open-BFME/Open-BFME-2' && github.ref == 'refs/heads/master'
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Install dependencies (image_ownership also needs numpy)
        run: python -m pip install -r reference/open-bfme-1/tools/requirements.txt numpy -c ${{ env.CONSTRAINTS }}
      # No link_check --fetch-index: build.py, boot_image.py and image_ownership.py never read the
      # census index, and its object bundle is only a compile cache (a cold build here instead).
      - name: Check ledger integrity
        run: python tools/check_csv.py
      - name: Full build with retail byte verification
        run: python tools/build.py
      - name: Link the boot image (relayout, own data)
        shell: python
        run: |
          import json
          import subprocess
          import sys

          # boot_image exits 1 when the image linked but its check found differences;
          # image_ownership then refuses to verify it, so only a failed link stops here.
          rc = subprocess.run([sys.executable, 'tools/boot_image.py', 'link', '--overlay', 'Code/', '--relayout',
                               '--own-data', '--out', 'build/boot/nightly', '--tag', 'relayout']).returncode
          if rc == 1:
              with open('build/boot/nightly/relayout.json', encoding='utf-8') as f:
                  rc = 0 if json.load(f).get('link_exit') == 0 else 1
              print('boot_image: the image linked; its check found differences' if rc == 0 else 'link failed')
          sys.exit(rc)
      - name: Ownership report
        run: python tools/image_ownership.py report build/boot/nightly/relayout.json --limit 40
      - name: Package the boot handoff
        run: python tools/nightly_measure.py --actions handoff-boot --commit ${{ github.sha }} --out "${{ runner.temp }}/handoff-boot"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-boot
          path: ${{ runner.temp }}/handoff-boot
          retention-days: 3
          if-no-files-found: error
          overwrite: true
      - name: Preserve the boot logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-boot-logs-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/boot/nightly/*.json
            build/boot/nightly/*.log

  cycle:
    name: Link cycle at the commit's snapshot
    if: vars.NIGHTLY_ENABLED == 'true' && github.repository == 'Open-BFME/Open-BFME-2' && github.ref == 'refs/heads/master'
    runs-on: windows-2025
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Install dependencies
        run: python -m pip install -r reference/open-bfme-1/tools/requirements.txt -c ${{ env.CONSTRAINTS }}
      - name: Link cycle (cold compile in an immutable snapshot)
        timeout-minutes: 300      # under the job's 330, so a stuck cycle still uploads its logs
        run: python tools/link_cycle.py --snapshot ${{ github.sha }} --snapshot-dir "${{ runner.temp }}/lcs" --build
      - name: Validate, closure report, first-pass bundle
        shell: python
        env:
          SHA: ${{ github.sha }}
        run: |
          import os
          import subprocess
          import sys

          run = os.path.join(os.environ['RUNNER_TEMP'], 'lcs', os.environ['SHA'][:10], 'build', 'link_cycle')
          for argv in (['tools/publish_cycle.py', 'validate', run],
                       ['tools/closure_report.py', 'graph', run, '--out', run],
                       ['tools/publish_cycle.py', 'bundle', run, '--out', os.path.join(os.environ['RUNNER_TEMP'], 'bundle'),
                        '--producer', 'github-actions/nightly-measure', '--first']):
              if subprocess.run([sys.executable, *argv]).returncode:
                  sys.exit(1)
      - name: Package the cycle handoff
        run: python tools/nightly_measure.py --actions handoff-cycle --commit ${{ github.sha }} --snapshot-dir "${{ runner.temp }}/lcs" --bundle "${{ runner.temp }}/bundle" --out "${{ runner.temp }}/handoff-cycle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-cycle
          path: ${{ runner.temp }}/handoff-cycle
          retention-days: 3
          if-no-files-found: error
          overwrite: true
      - name: Preserve the cycle logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-cycle-logs-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lcs/*/build/link_cycle/*.log
            ${{ runner.temp }}/lcs/*/build/link_cycle/receipt.json

  publish:
    name: Validate, sign, publish
    needs: [boot, cycle]
    if: vars.NIGHTLY_ENABLED == 'true' && github.repository == 'Open-BFME/Open-BFME-2' && github.ref == 'refs/heads/master'
    runs-on: windows-2025     # the runner paths the build jobs' receipts and dependency records name
    timeout-minutes: 120
    permissions:
      contents: write           # the history row's push; releases use BFME_RELEASE_TOKEN
    environment: nightly-publish
    env:
      SSH_KEYGEN: C:\Program Files\Git\usr\bin\ssh-keygen.exe
      NIGHTLY_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          submodules: true
          fetch-depth: 0            # receipt ancestry, then the rebase of the history row
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Install dependencies; python3 for the repository hooks
        shell: pwsh
        run: |
          python -m pip install -r reference/open-bfme-1/tools/requirements.txt numpy -c $env:CONSTRAINTS
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $py = Join-Path $env:pythonLocation 'python.exe'
          $py3 = Join-Path $env:pythonLocation 'python3.exe'
          if (-not (Test-Path $py3)) { Copy-Item $py $py3 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-boot
          path: ${{ runner.temp }}/handoff-boot
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-cycle
          path: ${{ runner.temp }}/handoff-cycle
      - name: Validate the handoffs with this checkout's tools (no secret)
        run: python tools/nightly_measure.py --actions validate --commit ${{ github.sha }} --state-dir "${{ runner.temp }}/nightly-state" --snapshot-dir "${{ runner.temp }}/lcs" --boot-handoff "${{ runner.temp }}/handoff-boot" --cycle-handoff "${{ runner.temp }}/handoff-cycle"
      - name: Write the signing key and the signer pin
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.BFME_OWNERSHIP_SIGNING_KEY }}
          SIGNER_PIN: ${{ vars.BFME_OWNERSHIP_ALLOWED_SIGNERS }}
        run: |
          if (-not $env:SIGNING_KEY -or -not $env:SIGNER_PIN) { throw 'nightly-publish lacks BFME_OWNERSHIP_SIGNING_KEY or BFME_OWNERSHIP_ALLOWED_SIGNERS' }
          $dir = Join-Path $env:RUNNER_TEMP 'nightly-secrets'
          New-Item -ItemType Directory $dir | Out-Null
          icacls $dir /inheritance:r /grant:r "${env:USERNAME}:(OI)(CI)(F)" | Out-Null
          if ($LASTEXITCODE) { throw 'cannot restrict the secret directory' }
          $key = Join-Path $dir 'ownership_key'
          [IO.File]::WriteAllText($key, ($env:SIGNING_KEY.Trim() -replace "`r`n", "`n") + "`n")
          icacls $key /inheritance:r /grant:r "${env:USERNAME}:(R)" | Out-Null
          if ($LASTEXITCODE) { throw 'cannot restrict the key file' }
          [IO.File]::WriteAllText((Join-Path $dir 'allowed_signers'), $env:SIGNER_PIN.Trim() + "`n")
      - name: Re-measure the bound artifacts and sign the history row
        env:
          BFME_OWNERSHIP_ALLOWED_SIGNERS: ${{ runner.temp }}\nightly-secrets\allowed_signers
        run: |
          $dry = @(); if ($env:NIGHTLY_DRY_RUN) { $dry += '--no-publish' }
          python tools/nightly_measure.py --actions sign --commit ${{ github.sha }} --state-dir "${{ runner.temp }}/nightly-state" --signing-key "${{ runner.temp }}\nightly-secrets\ownership_key" --ssh-keygen "$env:SSH_KEYGEN" @dry
      - name: Delete the signing key
        if: always()
        shell: pwsh
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'nightly-secrets\ownership_key'
          if (Test-Path $key) {
            icacls $key /grant "${env:USERNAME}:(F)" | Out-Null
            Remove-Item -Force $key
          }
          if (Test-Path $key) { throw 'the signing key is still on disk' }
      - name: Publish the cycle bundle and the ownership release
        env:
          BFME_RELEASE_TOKEN: ${{ secrets.BFME_RELEASE_TOKEN }}
          BFME_OWNERSHIP_ALLOWED_SIGNERS: ${{ runner.temp }}\nightly-secrets\allowed_signers
        run: |
          $dry = @(); if ($env:NIGHTLY_DRY_RUN) { $dry += '--no-publish' }
          python tools/nightly_measure.py --actions publish --commit ${{ github.sha }} --repo ${{ github.repository }} --producer github-actions/nightly-measure --state-dir "${{ runner.temp }}/nightly-state" --snapshot-dir "${{ runner.temp }}/lcs" --ssh-keygen "$env:SSH_KEYGEN" @dry
      - name: Commit the signed row through the repository hooks and push it
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          PUSH_TOKEN: ${{ github.token }}
          BFME_OWNERSHIP_ALLOWED_SIGNERS: ${{ runner.temp }}\nightly-secrets\allowed_signers
        run: |
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:PUSH_TOKEN"))
          Write-Output "::add-mask::$basic"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          $env:PUSH_TOKEN = ''
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/nightly_measure.py --actions history --commit ${{ github.sha }} --repo ${{ github.repository }} --state-dir "${{ runner.temp }}/nightly-state" --snapshot-dir "${{ runner.temp }}/lcs" --ssh-keygen "$env:SSH_KEYGEN"
          exit $LASTEXITCODE
      - name: Preserve the publisher's logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-publish-logs-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/nightly-state/logs/*.log
            ${{ runner.temp }}/nightly-state/actions.json
            ${{ runner.temp }}/nightly-state/image_ownership.json
            ${{ runner.temp }}/nightly-state/image_ownership_history.csv
