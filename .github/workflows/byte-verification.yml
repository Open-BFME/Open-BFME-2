name: Retail byte verification

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sources:
        description: 'Optional source paths or symbols, one per line; empty verifies all rows'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: retail-byte-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BUILD_POOL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -r reference/open-bfme-1/tools/requirements.txt
      - name: Check ledger integrity
        run: python tools/check_csv.py
      - name: Verify retail bytes with MSVC 7.1
        env:
          VERIFY_SOURCES: ${{ inputs.sources }}
        shell: python
        run: |
          import os
          import subprocess
          import sys

          sources = [line.strip() for line in os.environ.get('VERIFY_SOURCES', '').splitlines() if line.strip()]
          result = subprocess.run([sys.executable, 'tools/build.py', *sources])
          sys.exit(result.returncode)
      - name: Report conflicting address references
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          reports = Path('build/ci-diagnostics')
          reports.mkdir(parents=True, exist_ok=True)
          for name, symbol in [('game-logic', '?TheGameLogic@@3PAVGameLogic@@A'),
                               ('virtual-call-thunk', '??_9@$BA@AE')]:
              with (reports / (name + '.txt')).open('w', encoding='utf-8') as output:
                  result = subprocess.run([sys.executable, 'tools/dir32.py', symbol],
                                          stdout=output, stderr=subprocess.STDOUT)
                  output.write('\nDiagnostic exit code: ' + str(result.returncode) + '\n')
      - name: Upload address diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: address-diagnostics
          path: build/ci-diagnostics/
          if-no-files-found: ignore
