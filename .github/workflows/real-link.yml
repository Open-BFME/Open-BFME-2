name: Real link measurement

# Builds master from scratch and runs the real link: no /FORCE, no stubs, no fillers, a base
# retail never used (tools/exit_link.py). A measurement: it records nothing in reverse/ and
# credits no row. A refusal is a published result, not a hidden failure: scoreboard.json holds
# the tool's refusal and, for omitted funclets only, a link run past that one proof and labelled
# non-authoritative, so the missing names stay visible while the funclets are repaired.
# The report job holds the Discord secret and reads only the published artifacts.

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-link-measurement
  cancel-in-progress: false

env:
  BUILD_POOL: '4'
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  measure:
    if: github.repository == 'Open-BFME/Open-BFME-2' && github.ref == 'refs/heads/master'
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Non-recursive: BFME 1 references BFME 2, which references BFME 1.
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Install dependencies
        run: python -m pip install -r reference/open-bfme-1/tools/requirements.txt -c .github/nightly-constraints.txt
      - name: Full build with retail byte verification
        id: build
        continue-on-error: true
        run: python tools/build.py
      - name: Real link
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          MEASURE = r"""
          import sys
          sys.path.insert(0, 'tools')
          import exit_link
          orig = exit_link.omission_proof
          def measured(*a, **k):
              p = orig(*a, **k)
              names = {e['name'] for e in p['uncovered_funclets']}
              p['measurement_note'] = 'omission proof failed for these funclets; link run as a measurement anyway'
              p['uncovered_funclets_recorded'] = p['uncovered_funclets']
              p['uncovered_funclets'] = []
              p['unproven_recorded'] = p['unproven']
              p['unproven'] = [e for e in p['unproven'] if e.get('name') not in names]
              return p
          exit_link.omission_proof = measured
          sys.exit(exit_link.run_link(exit_link.census.ledger()))
          """.replace("\n          ", "\n")

          out = Path('build/exit_link')
          out.mkdir(parents=True, exist_ok=True)
          started = time.time()
          run = subprocess.run([sys.executable, 'tools/exit_link.py', '--link'], capture_output=True, text=True)
          log = run.stdout + run.stderr
          refusal = (run.stderr.strip().splitlines() or [''])[-1] if run.returncode else None
          measured = bool(refusal and 'omitted funclet' in refusal)
          if measured:
              again = subprocess.run([sys.executable, '-c', MEASURE], capture_output=True, text=True)
              log += '\n=== measured past the funclet proof ===\n' + again.stdout + again.stderr
          (out / 'run.log').write_text(log, encoding='utf-8')
          board = {'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                   'when': time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime()),
                   'build': os.environ['BUILD_OUTCOME'], 'refusal': refusal, 'authoritative': not measured,
                   'link_seconds_with_proofs': round(time.time() - started)}
          result = out / 'result.json'
          if result.exists():
              data = json.loads(result.read_text(encoding='utf-8'))
              board.update(linker_exit=data['link']['exit'], image_written=data['link']['image_written'],
                           unresolved=data['errors']['unresolved'], duplicates=data['errors']['duplicates'],
                           objects=data['objects']['linked'],
                           initializers_bridged=data.get('initializer_bridge', {}).get('entries'),
                           omitted_funclets=[e['name'] for e in
                                             data['omission_proof'].get('uncovered_funclets_recorded', [])])
          (out / 'scoreboard.json').write_text(json.dumps(board, indent=1) + '\n', encoding='utf-8')
          text = json.dumps(board, indent=1)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Real link measurement\n\n```json\n' + text + '\n```\n')
      - name: Compare the objects with retail
        continue-on-error: true
        run: python tools/exit_link.py --image-report
      - name: Analyze real linked image
        if: always()
        continue-on-error: true
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path
          out = Path('build/exit_link')
          if (out / 'exit.exe').exists():
              subprocess.run([sys.executable, 'tools/image_report.py',
                              '--image', str(out / 'exit.exe'), '--map', str(out / 'exit.map'),
                              '--objects', str(out / 'image_objects.json'),
                              '--out', str(out / 'linked_report')], check=True)
      - name: Stage real image
        if: always()
        shell: python
        run: |
          import json
          import shutil
          from pathlib import Path
          out = Path('build/exit_link')
          receipt = out / 'image_receipt.json'
          data = json.loads(receipt.read_text()) if receipt.exists() else {}
          if data.get('kind') == 'real' and data.get('authoritative') is True:
              (out / 'image').mkdir(exist_ok=True)
              for name in ('exit.exe', 'exit.map', 'image_receipt.json'):
                  shutil.copy2(out / name, out / 'image' / name)
              for path in out.glob('image_objects*'):
                  target = out / 'image' / path.name
                  if path.is_dir():
                      shutil.copytree(path, target, dirs_exist_ok=True)
                  else:
                      shutil.copy2(path, target)
      - name: Publish the result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-link-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/exit_link/scoreboard.json
            build/exit_link/result.json
            build/exit_link/errors.tsv
            build/exit_link/link.log
            build/exit_link/run.log
            build/exit_link/image_report.json
            build/exit_link/image/
            build/exit_link/linked_report/

      - name: Diagnostic link
        if: always()
        continue-on-error: true
        timeout-minutes: 60
        run: python tools/exit_link.py --diagnostic
      - name: Analyze diagnostic linked image
        if: always()
        continue-on-error: true
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path
          out = Path('build/diagnostic_link')
          if (out / 'exit.exe').exists():
              subprocess.run([sys.executable, 'tools/image_report.py',
                              '--image', str(out / 'exit.exe'), '--map', str(out / 'exit.map'),
                              '--objects', str(out / 'image_objects.json'),
                              '--out', str(out / 'linked_report')], check=True)
      - name: Stage diagnostic image
        if: always()
        continue-on-error: true
        shell: python
        run: |
          import json
          import shutil
          from pathlib import Path
          out = Path('build/diagnostic_link')
          receipt = out / 'image_receipt.json'
          if receipt.exists() and json.loads(receipt.read_text())['kind'] == 'diagnostic':
              (out / 'image').mkdir(exist_ok=True)
              for name in ('exit.exe', 'exit.map', 'image_receipt.json'):
                  shutil.copy2(out / name, out / 'image' / name)
              for path in out.glob('image_objects*'):
                  target = out / 'image' / path.name
                  if path.is_dir():
                      shutil.copytree(path, target, dirs_exist_ok=True)
                  else:
                      shutil.copy2(path, target)
      - name: Publish diagnostic result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostic-link-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/diagnostic_link/image/
            build/diagnostic_link/stubbed.tsv
            build/diagnostic_link/link.log
            build/diagnostic_link/linked_report/

  report:
    needs: measure
    if: always() && needs.measure.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Post the result to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WEBHOOK: ${{ secrets.DISCORD_PROGRESS_WEBHOOK }}
          DISCORD_POSTS: ${{ vars.DISCORD_POSTS }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import tempfile
          import urllib.request

          RUN = int(os.environ['GITHUB_RUN_ID'])


          def board(run_id, sha):
              with tempfile.TemporaryDirectory() as folder:
                  done = subprocess.run(['gh', 'run', 'download', str(run_id), '-n', f'real-link-{sha}', '-D', folder])
                  if done.returncode:
                      return None
                  with open(f'{folder}/scoreboard.json', encoding='utf-8') as handle:
                      result = json.load(handle)
                  if os.path.exists(f'{folder}/image_report.json'):
                      with open(f'{folder}/image_report.json', encoding='utf-8') as handle:
                          result['image_report'] = json.load(handle)['summary']
                  return result


          now = board(RUN, os.environ['GITHUB_SHA'])
          runs = json.loads(subprocess.run(['gh', 'api', '/repos/' + os.environ['GH_REPO'] +
                                            '/actions/workflows/real-link.yml/runs?status=success&per_page=10'],
                                           capture_output=True, text=True, check=True).stdout)['workflow_runs']
          older = next((run for run in runs if run['id'] != RUN), None)
          before = board(older['id'], older['head_sha']) if older else None
          label = 'official' if now['authoritative'] else 'unofficial: past the funclet proof'
          if now.get('image_written'):
              line = f"**The real link wrote an executable** at `{now['commit'][:10]}` ({label})."
          elif 'unresolved' in now:
              was = f", was {before['unresolved']}" if before and 'unresolved' in before else ''
              line = (f"Real link at `{now['commit'][:10]}`: {now['unresolved']} missing{was}, "
                      f"{now['duplicates']} duplicates ({label}).")
              if now.get('omitted_funclets'):
                  line += f" {len(now['omitted_funclets'])} funclets still block the official run."
          else:
              line = f"Real link at `{now['commit'][:10]}` was refused: {str(now['refusal'])[:300]}"
          if 'image_report' in now:
              seen = now['image_report']
              line += (f"\nAgainst retail: {seen['initializers']['registered_retail_entries']} of "
                       f"{seen['initializers']['retail']} initializers registered, "
                       f"{seen['vtables']['ours_shorter']} vtables with a short copy, "
                       f"{seen['fieldparse']['contents_differ']} parse tables differ, "
                       f"{seen['globals']['contents_differ'] + seen['globals']['ours_zero_retail_not']} globals differ.")
          line += f" <{os.environ['GITHUB_SERVER_URL']}/{os.environ['GH_REPO']}/actions/runs/{RUN}>"
          print(line)
          if os.environ.get('DISCORD_POSTS') != 'true':
              print('DISCORD_POSTS is not true: not posting')
              raise SystemExit(0)
          body = json.dumps({'content': line, 'allowed_mentions': {'parse': []}}).encode()
          request = urllib.request.Request(os.environ['WEBHOOK'], data=body, method='POST',
                                           headers={'Content-Type': 'application/json', 'User-Agent': 'bfme2-alarm'})
          with urllib.request.urlopen(request) as response:
              print('posted', response.status)
